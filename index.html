<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B5C">
<meta name="description" content="كتالوج طرابيه للأدوات المنزلية - تصفح المنتجات والأسعار واطلب على واتساب">
<meta property="og:type" content="website">
<meta property="og:title" content="طرابيه للأدوات المنزلية">
<meta property="og:description" content="تصفح المنتجات والأسعار واطلب على واتساب - توصيل مجاني داخل جمصة">
<meta property="og:image" content="https://tarabihshop.github.io/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>طرابيه للأدوات المنزلية</title>
<style>
:root{--brand:#0E6B5C;--page:#F6F4EF;--ink:#1F2937;--mut:#6B7280;--field:#EFEDE7;--amber:#F59E0B;--red:#DC2626;--orange:#D97706;--green:#15803D;--wa:#25D366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--page);color:var(--ink);padding-bottom:90px}
button{font-family:inherit;cursor:pointer}
header{background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{width:42px;height:42px;border-radius:10px}
header .t{flex:1;line-height:1.2}header .t b{font-size:21px;display:block}header .t small{opacity:.8;font-size:12px}
#install{display:none;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:12px;padding:8px 12px;font-size:13px}
#hist{display:none;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:12px;padding:8px 12px;font-size:13px}
.wrap{max-width:1100px;margin:0 auto;padding:0 10px}
#banner{margin:10px 2px 0;background:rgba(21,128,61,.12);color:var(--green);font-weight:700;font-size:13px;text-align:center;padding:9px 10px;border-radius:12px}
#search{width:100%;margin-top:10px;border:0;background:#fff;border-radius:14px;padding:13px 16px;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-family:inherit}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip-c{flex:none;border:0;background:#fff;color:var(--brand);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700}
.chip-c.on{background:var(--brand);color:#fff}

/* شريط مجموعات المقاسات على سطرين داخل الصفحة */
#sizebar{display:none;align-items:flex-start;gap:8px;padding:0 2px 10px}
#sizebar b{flex:none;font-size:13px;color:var(--mut);padding-top:8px}
#sizechips{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:6px;
  flex:1;
}
#sizechips .chip-c{
  flex:initial;
  width:100%;
  padding:7px 6px;
  font-size:12px;
  border-radius:12px;
  text-align:center;
  white-space:nowrap;
}

#count{color:var(--mut);font-size:12px;padding:0 4px 6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.card{background:#fff;border-radius:18px;padding:8px 8px 10px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;display:flex;flex-direction:column}
.imgbox{position:relative;aspect-ratio:1/1;background:var(--field);border-radius:14px;overflow:hidden}
.imgbox::before{content:'🏠';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;opacity:.25}
.imgbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--field)}
.new{position:absolute;top:6px;right:6px;background:var(--amber);color:#1F2937;font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px;z-index:1}
.off{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px;z-index:1}
.old{color:#9CA3AF;text-decoration:line-through;font-weight:600;font-size:12px;margin-left:6px}
.nm{font-weight:700;font-size:14px;margin-top:8px;line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pr{color:var(--brand);font-weight:800;font-size:15px;margin-top:2px}
.pr.big{font-size:20px;margin-top:8px}
.chip{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;margin-top:6px}
.chip.ok{color:var(--green);background:rgba(21,128,61,.14)}.chip.low{color:var(--orange);background:rgba(217,119,6,.15)}.chip.out{color:var(--red);background:rgba(220,38,38,.12)}
.mut{color:var(--mut);font-size:12px;margin-top:4px}
#empty{display:none;text-align:center;color:var(--mut);padding:40px 20px}
#more{height:10px}
.offline{display:block;margin:16px auto 0;border:0;background:#E5F1EE;color:var(--brand);font-weight:700;border-radius:14px;padding:12px 16px;font-size:14px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.1);display:none;z-index:6}
#barbtn{width:100%;border:0;background:var(--amber);color:#1F2937;font-weight:800;font-size:16px;border-radius:16px;padding:15px}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .ov{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--page);border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto}
.x{position:absolute;top:10px;left:12px;border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.bigbox{background:#fff;border-radius:18px;padding:8px;aspect-ratio:1/1;max-height:60vh;margin:0 auto}
.bigbox img{width:100%;height:100%;object-fit:contain}
h2{margin:12px 0 0;font-size:22px}
.sec{font-weight:800;margin:16px 0 8px}

/* مقاسات المنتج داخل النافذة السفلية: تلتف على سطرين أو أكثر داخل الصفحة */
.sizes{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px}
.sz{flex:none;border:0;background:#fff;color:var(--brand);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700}
.sz.on{background:var(--brand);color:#fff}.sz.out{color:var(--mut);text-decoration:line-through}
.qrow{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
.qrow span{flex:1;color:var(--mut)}
.qrow button{width:44px;height:44px;border:0;border-radius:14px;background:#E5F1EE;color:var(--brand);font-size:22px;font-weight:800}
.qrow b{min-width:44px;text-align:center;font-size:20px}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;margin-top:10px}
.btn.main{background:var(--brand);color:#fff}.btn.wa{background:var(--wa);color:#1F2937}.btn.img{background:#fff;color:var(--brand)}.btn.del{background:#FDE8E8;color:var(--red);font-size:14px;padding:12px}
.btn:disabled{opacity:.4}
.line{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:8px}
.line .im{width:64px;height:64px;border-radius:12px;background:var(--field);flex:none;overflow:hidden}
.line .im img{width:100%;height:100%;object-fit:contain}
.line .in{flex:1;min-width:0}.line .in b{font-size:14px;display:block}
.line .st{display:flex;align-items:center;gap:6px;margin-top:6px}
.line .st button{width:34px;height:34px;border:0;border-radius:10px;background:#E5F1EE;color:var(--brand);font-size:18px;font-weight:800}
.line .rm{border:0;background:none;color:var(--red);font-size:20px;padding:6px}
.tot{background:#fff;border-radius:16px;padding:12px;margin:10px 0}
.tot b{color:var(--brand)}.dl{color:var(--green);font-weight:800;font-size:14px;margin-top:6px}
input.f,textarea.f{width:100%;border:0;background:#fff;border-radius:14px;padding:13px 14px;font-size:15px;margin-top:8px;font-family:inherit}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:40;display:none;max-width:90%;text-align:center}
#prog{position:fixed;top:0;left:0;height:3px;background:var(--amber);width:0;z-index:50;transition:width .2s}
</style>
</head>
<body>
<div id="prog"></div>
<header>
  <img src="icons/icon-192.png" alt="">
  <div class="t"><b id="store">طرابيه</b><small id="sub">للأدوات المنزلية</small></div>
  <button id="hist">📜 طلباتي</button>
  <button id="install">⬇️ ثبّت</button>
</header>
<div class="wrap">
  <div id="banner" style="display:none"></div>
  <input id="search" type="search" placeholder="🔍 ابحث بالاسم أو المقاس..." autocomplete="off">
  <div id="chips"></div>
  <div id="sizebar"><b>📏 المقاس:</b><div id="sizechips"></div></div>
  <div style="display:flex;align-items:center;gap:8px;padding-bottom:6px">
    <div id="count" style="flex:1"></div>
    <select id="sort" style="background:#fff;border:0;border-radius:12px;padding:6px 10px;font-size:13px;font-family:inherit;color:var(--brand);font-weight:700">
      <option value="">الترتيب: الافتراضي</option><option value="new">الأحدث</option><option value="low">الأرخص</option><option value="high">الأغلى</option>
    </select>
  </div>
  <div id="grid"></div>
  <div id="empty"></div>
  <div id="more"></div>
  <button class="offline" id="offline">📥 احفظ الكتالوج على موبايلك (يشتغل من غير نت)</button>
</div>
<div id="bar"><button id="barbtn"></button></div>
<div id="sheet"><div class="ov" id="ov"></div><div id="panel"></div></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const DEF = {store:'طرابيه', sub:'للأدوات المنزلية',
  banner:'🚚 توصيل مجاني لأي فاتورة أكتر من 600 جنيه داخل جمصة', free_over:600,
  free_text:'🎉 توصيل مجاني داخل جمصة', hint_text:'🚚 ضيف {n} ج كمان ويبقى التوصيل مجاني داخل جمصة',
  whatsapp:'', wa_link:'https://wa.me/message/NO6AHUKPPHO3L1', show_price:true, min_price:4, new_days:14,
  low_stock:5, limit_to_stock:true, notice:'', offers_first:true, show_qty:true};
let CFG = Object.assign({}, DEF), P = [], byId = {}, cart = [], cat = '', q = '', size = '', shown = 0, curList = [], sortMode = '', extra = {phone: '', addr: ''};
const PAGE = 60;
const SIZE_RANGES = [
  {key:'17-20', label:'17–20', min:17, max:20},
  {key:'21-25', label:'21–25', min:21, max:25},
  {key:'26-30', label:'26–30', min:26, max:30},
  {key:'31-35', label:'31–35', min:31, max:35},
  {key:'36-40', label:'36–40', min:36, max:40},
  {key:'41-45', label:'41–45', min:41, max:45},
  {key:'46-50', label:'46–50', min:46, max:50}
];
try { cart = JSON.parse(localStorage.getItem('tb_cart') || '[]'); } catch (e) { cart = []; }
try { Object.assign(extra, JSON.parse(localStorage.getItem('tb_extra') || '{}')); } catch (e) {}
const saveCart = () => { try { localStorage.setItem('tb_cart', JSON.stringify(cart)); } catch (e) {} renderBar(); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const r = Math.round(n * 10) / 10; return r % 1 === 0 ? String(Math.round(r)) : r.toFixed(1); };
const fmtUpd = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'}); };
/* توحيد الحروف العربية للبحث: أ/إ/آ=ا ، ة=ه ، ى=ي ، وشيل التشكيل */
const ar = s => String(s || '').toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
const h = s => { let x = 5381; s = String(s || ''); for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); };
const count = () => cart.reduce((a, l) => a + l.q, 0);
const total = () => cart.reduce((a, l) => a + l.p * l.q, 0);
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600); }
function stock(v) { const n = CFG.show_qty === false; if (v < 1) return ['نفدت الكمية', 'out']; if (v <= CFG.low_stock) return ['كمية قليلة' + (n ? '' : ': ' + fmt(v)), 'low']; return ['متوفر' + (n ? '' : ': ' + fmt(v)), 'ok']; }
function isNew(cd) { const t = Date.parse(String(cd || '').replace(' ', 'T') + 'Z'); return !!t && (Date.now() - t) < CFG.new_days * 864e5; }
const tok = l => String(l || '').split('/').map(s => s.trim()).filter(Boolean);
function matchRange(label, rangeKey) {
  const r = SIZE_RANGES.find(x => x.key === rangeKey);
  if (!r) return true;
  for (const part of tok(label)) {
    const nums = (part.match(/\d+(?:\.\d+)?/g) || []).map(Number).filter(n => n >= 17 && n <= 50);
    if (nums.some(n => n >= r.min && n <= r.max)) return true;
  }
  return false;
}
function sizeList(p) {
  const a = p.v.filter(x => x.q >= 1 && x.l).map(x => x.l);
  return a.length ? a.slice(0, 4).join(' · ') + (a.length > 4 ? ' …' : '') : p.v.length + ' مقاسات/خيارات';
}
function renderSizes() {
  const avail = SIZE_RANGES.filter(r =>
    P.some(p => p.v.some(v => v.q >= 1 && matchRange(v.l, r.key)))
  );
  $('#sizebar').style.display = avail.length ? 'flex' : 'none';
  if (size && !avail.some(r => r.key === size)) size = '';
  $('#sizechips').innerHTML = avail.map(r =>
    '<button class="chip-c' + (r.key === size ? ' on' : '') + '" data-s="' + esc(r.key) + '">' + esc(r.label) + '</button>'
  ).join('');
}
function priceHtml(p) {
  if (!CFG.show_price) return '';
  if (p.off) { const v = p.v.filter(x => x.o > x.p).sort((a, b) => a.p - b.p)[0]; return '<div class="pr"><span class="old">' + fmt(v.o) + '</span>' + fmt(v.p) + ' ج</div>'; }
  return '<div class="pr">' + priceText(p) + '</div>';
}
function priceText(p) { const a = p.v.map(x => x.p), mn = Math.min.apply(null, a), mx = Math.max.apply(null, a); return (mx - mn > 0.005 ? 'من ' : '') + fmt(mn) + ' ج'; }
function norm(raw) {
  return raw.map(p => {
    const v = (p.v || []).filter(x => x.p >= CFG.min_price);
    if (!v.length) return null;
    let disc = 0; v.forEach(x => { if (x.o && x.o > x.p) disc = Math.max(disc, Math.round((x.o - x.p) / x.o * 100)); });
    return Object.assign({}, p, {v: v, q: v.reduce((a, x) => a + x.q, 0), key: ar((p.n || '') + ' ' + (p.c || '') + ' ' + (p.g || '') + ' ' + v.map(x => x.l || '').join(' ')), isNew: isNew(p.cd), off: disc > 0, disc: disc});
  }).filter(Boolean).sort((a, b) => (CFG.offers_first ? (b.off - a.off) : 0) || String(b.cd || '').localeCompare(String(a.cd || '')) || b.id - a.id);
}
const imgUrl = (p, k) => k + '/' + p.id + '.jpg?v=' + h(p.w);

/* ---------- الشبكة ---------- */
function card(p) {
  const s = stock(p.q);
  return '<div class="card" data-id="' + p.id + '"><div class="imgbox"><img loading="lazy" decoding="async" alt="" src="' + imgUrl(p, 't') + '">' +
    (p.isNew ? '<span class="new">🆕 جديد</span>' : '') + (p.off ? '<span class="off">🔥 عرض -' + p.disc + '%</span>' : '') + '</div><div class="nm">' + esc(p.n) + '</div>' +
    priceHtml(p) +
    '<span class="chip ' + s[1] + '">' + s[0] + '</span>' +
    (p.v.length > 1 ? '<div class="mut">📏 ' + esc(sizeList(p)) + '</div>' : '') + '</div>';
}
function renderGrid() {
  curList = P.filter(p => (!cat || (cat === '__offers__' ? p.off : p.g === cat)) && (!q || p.key.indexOf(q) >= 0) && (!size || p.v.some(v => v.q >= 1 && matchRange(v.l, size))));
  if (sortMode) {
    const mp = p => Math.min.apply(null, p.v.map(x => x.p));
    curList.sort(sortMode === 'low' ? (a, b) => mp(a) - mp(b) : sortMode === 'high' ? (a, b) => mp(b) - mp(a) : (a, b) => String(b.cd || '').localeCompare(String(a.cd || '')) || b.id - a.id);
  }
  shown = Math.min(PAGE, curList.length);
  $('#grid').innerHTML = curList.slice(0, shown).map(card).join('');
  $('#count').textContent = curList.length + ' منتج' + (CFG.updated && fmtUpd(CFG.updated) ? ' • آخر تحديث: ' + fmtUpd(CFG.updated) : '');
  $('#empty').style.display = curList.length ? 'none' : 'block';
  $('#empty').textContent = P.length ? 'مفيش منتجات مطابقة للبحث' : '';
}
function loadMore() {
  if (shown >= curList.length) return;
  const to = Math.min(curList.length, shown + PAGE);
  $('#grid').insertAdjacentHTML('beforeend', curList.slice(shown, to).map(card).join(''));
  shown = to;
}
function renderChips() {
  const cats = [''].concat(P.some(p => p.off) ? ['__offers__'] : [], Array.from(new Set(P.map(p => p.g))).sort());
  if (cats.indexOf(cat) < 0) cat = '';
  $('#chips').innerHTML = cats.map(c => '<button class="chip-c' + (c === cat ? ' on' : '') + '" data-c="' + esc(c) + '">' + (c === '__offers__' ? '🔥 العروض' : c ? esc(c) : 'الكل') + '</button>').join('');
}

/* ---------- النافذة السفلية ---------- */
let sheetOpen = false;
function openSheet(html) {
  $('#panel').innerHTML = '<button class="x" id="xb">✕</button>' + html;
  $('#sheet').classList.add('on'); document.body.style.overflow = 'hidden';
  if (!sheetOpen) { try { history.pushState({sheet: 1}, ''); } catch (e) {} sheetOpen = true; }
  $('#xb').onclick = () => closeSheet();
}
function closeSheet(fromPop) {
  $('#sheet').classList.remove('on'); document.body.style.overflow = '';
  if (sheetOpen) { sheetOpen = false; if (!fromPop) { try { history.back(); } catch (e) {} } }
}

/* ---------- تفاصيل المنتج ---------- */
function openProduct(id) {
  const p = byId[id]; if (!p) return;
  track('product/' + id, p.n);
  p.v.sort((a, b) => {
    const na = parseFloat(a.l), nb = parseFloat(b.l);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a.l || '').localeCompare(String(b.l || ''), 'ar');
  });
  const want = ar(size || q || '');
  let sel = -1;
  if (size) sel = p.v.findIndex(v => v.q >= 1 && matchRange(v.l, size));
  if (sel < 0 && want) sel = p.v.findIndex(v => v.q >= 1 && ar(v.l).indexOf(want) >= 0);
  if (sel < 0) sel = Math.max(0, p.v.findIndex(v => v.q >= 1));
  let qty = 1;
  const sizes = p.v.some(v => v.l);
  openSheet('<div class="bigbox"><img id="bigimg" alt="" src="' + imgUrl(p, 't') + '"></div><h2>' + esc(p.n) + '</h2><div id="dstock"></div>' +
    (CFG.show_price ? '<div id="dprice" class="pr big"></div>' : '') +
    (sizes ? '<div class="sec">📏 اختر المقاس / الخيار</div><div class="sizes" id="sizes"></div>' : '') +
    '<div class="qrow"><span>الكمية</span><button id="qm">−</button><b id="qv">1</b><button id="qp">+</button></div><button class="btn main" id="add">🛒 أضف للطلب</button><button class="btn img" id="shr">🔗 شارك المنتج</button>');
  const big = new Image(); big.onload = () => { const el = $('#bigimg'); if (el) el.src = big.src; }; big.src = imgUrl(p, 'm');
  const maxQ = () => CFG.limit_to_stock ? Math.floor(p.v[sel].q) : 999;
  function refresh() {
    const v = p.v[sel], s = stock(v.q);
    $('#dstock').innerHTML = '<span class="chip ' + s[1] + '">' + s[0] + '</span>';
    if (CFG.show_price) $('#dprice').innerHTML = (v.o > v.p ? '<span class="old">' + fmt(v.o) + '</span>' : '') + fmt(v.p) + ' ج';
    qty = Math.min(Math.max(1, qty), Math.max(1, maxQ())); $('#qv').textContent = qty;
    $('#add').disabled = CFG.limit_to_stock && v.q < 1;
    const sz = $('#sizes');
    if (sz) sz.innerHTML = p.v.map((x, i) => '<button class="sz' + (i === sel ? ' on' : '') + (x.q < 1 ? ' out' : '') + '" data-i="' + i + '">' + esc(x.l || 'افتراضي') + (CFG.show_qty === false ? '' : ' · ' + fmt(x.q)) + '</button>').join('');
  }
  $('#panel').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('sz')) { sel = +b.dataset.i; refresh(); }
    else if (b.id === 'qm') { qty = Math.max(1, qty - 1); refresh(); }
    else if (b.id === 'qp') { qty = Math.min(Math.max(1, maxQ()), qty + 1); refresh(); }
    else if (b.id === 'shr') { shareProduct(p); }
    else if (b.id === 'add') {
      const v = p.v[sel], ex = cart.find(l => l.id === p.id && l.l === v.l), cap = maxQ();
      if (ex) ex.q = Math.min(cap, ex.q + qty); else cart.push({id: p.id, l: v.l, q: qty, n: p.n, p: v.p, o: v.o > v.p ? v.o : 0, w: p.w});
      saveCart(); track('add/' + p.id, p.n); toast('✔ اتضاف للطلب'); closeSheet();
    }
  };
  refresh();
}

async function shareProduct(p) {
  const url = location.origin + location.pathname + '#p=' + p.id;
  const text = p.n + (CFG.show_price ? ' - ' + priceText(p) : '');
  if (navigator.share) { try { await navigator.share({title: CFG.store, text: text, url: url}); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text + '\n' + url); toast('✔ اتنسخ رابط المنتج'); }
  catch (e) { window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank'); }
}
function openFromHash() { const m = /#p=(\d+)/.exec(location.hash); if (m && byId[+m[1]]) openProduct(+m[1]); }

/* ---------- الإحصائيات (اختياري: بتشتغل لو حطيت goatcounter أو umami في config.json > app) ---------- */
function initStats() {
  if (document.getElementById('stats-js')) return;
  const gc = String(CFG.goatcounter || '').trim(), um = String(CFG.umami || '').trim();
  if (!gc && !um) return;
  const s = document.createElement('script');
  s.id = 'stats-js'; s.async = true; s.onerror = () => {};
  if (gc) {
    window.goatcounter = {no_onload: true, endpoint: 'https://' + gc + '.goatcounter.com/count'};
    s.src = 'https://gc.zgo.at/count.js';
    s.onload = () => { try { window.goatcounter.count(); } catch (e) {} };
  } else {
    s.src = 'https://cloud.umami.is/script.js';
    s.setAttribute('data-website-id', um);
  }
  document.head.appendChild(s);
}
function track(path, title) {
  try {
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({path: path, title: title || '', event: true});
    if (window.umami && window.umami.track) window.umami.track(path.indexOf('order/') === 0 ? path : path.split('/')[0], {item: title || path});
  } catch (e) {}
}

/* ---------- طلباتي السابقة (على جهاز العميل بس) ---------- */
function loadOrders() { try { return JSON.parse(localStorage.getItem('tb_orders') || '[]'); } catch (e) { return []; } }
function renderHist() { const b = $('#hist'); if (b) b.style.display = loadOrders().length ? 'block' : 'none'; }
function saveOrder(name) {
  if (!cart.length) return;
  const items = cart.map(l => ({id: l.id, l: l.l, q: l.q, n: l.n, p: l.p, o: l.o || 0}));
  const sig = JSON.stringify(items.map(i => [i.id, i.l, i.q])), os = loadOrders(), now = Date.now(), last = os[0];
  if (last && last.sig === sig && now - last.t < 30 * 60 * 1000) { last.t = now; if (name) last.n = name; }
  else os.unshift({t: now, n: name || '', sig: sig, items: items, c: count(), tot: total()});
  try { localStorage.setItem('tb_orders', JSON.stringify(os.slice(0, 20))); } catch (e) {}
  renderHist();
}
function reorder(o) {
  if (!o) return;
  let added = 0, skipped = 0;
  o.items.forEach(it => {
    const p = byId[it.id], v = p && p.v.find(x => x.l === it.l);
    if (!v || (CFG.limit_to_stock && v.q < 1)) { skipped++; return; }
    const cap = CFG.limit_to_stock ? Math.floor(v.q) : 999, ex = cart.find(l => l.id === p.id && l.l === v.l), old = v.o > v.p ? v.o : 0;
    if (ex) { ex.q = Math.min(cap, ex.q + it.q); ex.p = v.p; ex.o = old; }
    else cart.push({id: p.id, l: v.l, q: Math.min(cap, it.q), n: p.n, p: v.p, o: old, w: p.w});
    added++;
  });
  saveCart(); track('order/reorder', 'اطلب تاني');
  toast(added ? '✔ اتضاف ' + added + ' صنف للطلب' + (skipped ? ' - و' + skipped + ' مش متاح حاليًا' : '') : 'الأصناف دي مش متاحة حاليًا');
  if (added) openCart();
}
function openOrders() {
  const os = loadOrders();
  const cards = os.map((o, i) => {
    const d = new Date(o.t);
    const names = o.items.slice(0, 4).map(x => esc(x.q + '× ' + x.n + (x.l ? ' (' + x.l + ')' : ''))).join('<br>') + (o.items.length > 4 ? '<br>… و ' + (o.items.length - 4) + ' أصناف كمان' : '');
    return '<div class="tot"><b>' + esc(d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'})) + '</b>' +
      '<div class="mut">' + o.c + ' قطعة' + (CFG.show_price && o.tot > 0 ? ' • ' + fmt(o.tot) + ' ج' : '') + '</div>' +
      '<div class="mut" style="line-height:1.7">' + names + '</div>' +
      '<button class="btn main" data-o="' + i + '" style="margin-top:8px;padding:12px">🔁 اطلب تاني</button></div>';
  }).join('');
  openSheet('<h2 style="margin-top:4px">📜 طلباتي السابقة</h2><div style="margin-top:10px">' +
    (cards || '<div class="tot" style="text-align:center;color:var(--mut)">مفيش طلبات سابقة</div>') + '</div>' +
    (os.length ? '<button class="btn del" id="oclear">🗑️ مسح السجل</button>' : ''));
  $('#panel').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'oclear') { if (confirm('تمسح سجل الطلبات؟')) { try { localStorage.removeItem('tb_orders'); } catch (er) {} renderHist(); closeSheet(); } }
    else if (b.dataset.o != null) reorder(os[+b.dataset.o]);
  };
}

/* ---------- الطلب ---------- */
function deliveryMsg() {
  const t = total();
  if (!CFG.show_price || t <= 0) return '';
  if (t > CFG.free_over) return CFG.free_text;
  return CFG.hint_text.replace('{n}', fmt(Math.floor(CFG.free_over - t) + 1));
}
function orderText(name, note) {
  let s = '🛒 طلب جديد - ' + CFG.store + ' ' + CFG.sub + '\n';
  if (name) s += '👤 الاسم: ' + name + '\n';
  if (extra.phone) s += '📞 التليفون: ' + extra.phone + '\n';
  if (extra.addr) s += '📍 العنوان: ' + extra.addr + '\n';
  s += '────────────\n';
  cart.forEach((l, i) => {
    s += (i + 1) + ') ' + l.n + '\n';
    if (l.l) s += '   المقاس: ' + l.l + '\n';
    s += '   الكمية: ' + l.q + '\n';
    if (CFG.show_price && l.p > 0) s += '   السعر: ' + fmt(l.p) + ' ج' + (l.o > l.p ? ' (بدل ' + fmt(l.o) + ')' : '') + '\n';
  });
  s += '────────────\nإجمالي القطع: ' + count();
  if (CFG.show_price && total() > 0) s += '\n💰 الإجمالي: ' + fmt(total()) + ' ج';
  if (CFG.show_price && total() > CFG.free_over) s += '\n' + CFG.free_text;
  if (note) s += '\n📝 ملاحظات: ' + note;
  return s;
}
function waLink(text) {
  const n = String(CFG.whatsapp || '').replace(/\D/g, '');
  return n ? 'https://wa.me/' + n + '?text=' + encodeURIComponent(text) : CFG.wa_link;
}
function linesHtml() {
  if (!cart.length) return '<div class="tot" style="text-align:center;color:var(--mut)">الطلب فاضي - ارجع للكتالوج واختار منتجات 🛍️</div>';
  return cart.map((l, i) => '<div class="line"><div class="im"><img alt="" src="' + imgUrl(l, 't') + '"></div><div class="in"><b>' + esc(l.n) + '</b>' +
    (l.l ? '<div class="mut">المقاس: ' + esc(l.l) + '</div>' : '') +
    (CFG.show_price && l.p > 0 ? '<div class="mut" style="color:var(--brand);font-weight:700">' + (l.o > l.p ? '<span class="old">' + fmt(l.o) + '</span>' : '') + fmt(l.p) + ' ج × ' + l.q + ' = ' + fmt(l.p * l.q) + ' ج</div>' : '') +
    '<div class="st"><button data-a="m" data-i="' + i + '">−</button><b>' + l.q + '</b><button data-a="p" data-i="' + i + '">+</button></div></div>' +
    '<button class="rm" data-a="r" data-i="' + i + '">✕</button></div>').join('');
}
function totalsHtml() {
  const d = deliveryMsg();
  return '<div class="tot">إجمالي القطع: <b>' + count() + '</b>' + (CFG.show_price && total() > 0 ? ' &nbsp;|&nbsp; الإجمالي: <b>' + fmt(total()) + ' ج</b>' : '') +
    (d ? '<div class="dl">' + esc(d) + '</div>' : '') + '</div>';
}
function openCart() {
  let name = ''; try { name = localStorage.getItem('tb_name') || ''; } catch (e) {}
  openSheet('<h2 style="margin-top:4px">🛒 طلبك</h2><div style="margin-top:10px" id="lines"></div><div id="tots"></div>' +
    '<input class="f" id="cname" placeholder="اسمك (اختياري)" value="' + esc(name) + '"><input class="f" id="cphone" type="tel" inputmode="tel" placeholder="رقم التليفون (اختياري)" value="' + esc(extra.phone) + '"><input class="f" id="caddr" placeholder="العنوان للتوصيل (اختياري)" value="' + esc(extra.addr) + '"><textarea class="f" id="cnote" rows="2" placeholder="ملاحظات (اختياري)"></textarea>' +
    '<button class="btn wa" id="sendtxt">📲 إرسال الطلب على واتساب</button><button class="btn img" id="sendimg">🖼️ إرسال الفاتورة كصورة</button><button class="btn del" id="clear">🗑️ مسح الطلب</button>');
  const redraw = () => { $('#lines').innerHTML = linesHtml(); $('#tots').innerHTML = totalsHtml(); };
  const vals = () => { const n = $('#cname').value.trim(); extra.phone = $('#cphone').value.trim(); extra.addr = $('#caddr').value.trim(); try { localStorage.setItem('tb_name', n); localStorage.setItem('tb_extra', JSON.stringify(extra)); } catch (e) {} return [n, $('#cnote').value.trim()]; };
  $('#panel').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const i = +b.dataset.i;
    if (b.dataset.a === 'm') { cart[i].q = Math.max(1, cart[i].q - 1); saveCart(); redraw(); }
    else if (b.dataset.a === 'p') { cart[i].q += 1; saveCart(); redraw(); }
    else if (b.dataset.a === 'r') { cart.splice(i, 1); saveCart(); redraw(); }
    else if (b.id === 'clear') { if (confirm('تمسح الطلب كله؟')) { cart = []; saveCart(); redraw(); } }
    else if (b.id === 'sendtxt') { if (!cart.length) return toast('الطلب فاضي'); const v = vals(); saveOrder(v[0]); track('order/text', 'طلب نصي'); window.open(waLink(orderText(v[0], v[1])), '_blank'); }
    else if (b.id === 'sendimg') { if (!cart.length) return toast('الطلب فاضي'); const v = vals(); saveOrder(v[0]); track('order/image', 'طلب بصورة'); shareInvoice(v[0], v[1]); }
  };
  redraw();
}

/* ---------- الفاتورة كصورة ---------- */
function buildInvoice(name, note, imgs) {
  const W = 900, pad = 36, FONT = '"Segoe UI",Tahoma,Arial,sans-serif';
  const IMG = 120, GAP = 16; /* حجم صورة المنتج في الفاتورة */
  function wrap(ctx, text, maxW) {
    const words = String(text).split(/\s+/), lines = []; let cur = '';
    words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
    if (cur) lines.push(cur); return lines;
  }
  function paint(ctx, dry) {
    const R = W - pad, L = pad; let y;
    const T = (txt, x, yy, font, color, align) => { ctx.font = font; if (!dry) { ctx.fillStyle = color; ctx.textAlign = align || 'right'; ctx.fillText(txt, x, yy); } };
    const bar = (yy, color, hh) => { if (!dry) { ctx.fillStyle = color; ctx.fillRect(L, yy, W - 2 * pad, hh); } };
    ctx.direction = 'rtl'; ctx.textBaseline = 'alphabetic';
    if (!dry) { ctx.fillStyle = '#0E6B5C'; ctx.fillRect(0, 0, W, 150); }
    T(CFG.store, R, 72, 'bold 54px ' + FONT, '#fff');
    T(CFG.sub + '  •  فاتورة طلب', R, 118, '26px ' + FONT, '#d6efe9');
    y = 205;
    const d = new Date();
    T('التاريخ: ' + d.toLocaleDateString('ar-EG') + '  ' + d.toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'}), R, y, '26px ' + FONT, '#555'); y += 42;
    if (name) { T('العميل: ' + name, R, y, 'bold 29px ' + FONT, '#111'); y += 46; }
    if (extra.phone) { T('التليفون: ' + extra.phone, R, y, '26px ' + FONT, '#333'); y += 40; }
    if (extra.addr) { ctx.font = '26px ' + FONT; wrap(ctx, 'العنوان: ' + extra.addr, W - 2 * pad).forEach(ln => { T(ln, R, y, '26px ' + FONT, '#333'); y += 38; }); }
    y += 4; bar(y, '#e5e7eb', 3); y += 36;
    cart.forEach((l, i) => {
      ctx.font = 'bold 30px ' + FONT;
      const TX = imgs ? R - IMG - GAP : R; /* حافة النص اليمنى (بعد الصورة) */
      const ls = wrap(ctx, (i + 1) + ') ' + l.n, TX - L - 270), top = y;
      if (imgs && !dry) {
        const bx = R - IMG, by = top - 30;
        ctx.fillStyle = '#EFEDE7'; ctx.fillRect(bx, by, IMG, IMG);
        const im = imgs[l.id];
        if (im) {
          const sc = Math.min(IMG / im.width, IMG / im.height), iw = im.width * sc, ih = im.height * sc;
          ctx.drawImage(im, bx + (IMG - iw) / 2, by + (IMG - ih) / 2, iw, ih);
        }
      }
      ls.forEach(ln => { T(ln, TX, y, 'bold 30px ' + FONT, '#111'); y += 40; });
      if (l.l) { T('المقاس: ' + l.l, TX, y, '25px ' + FONT, '#666'); y += 36; }
      const nums = CFG.show_price && l.p > 0 ? (l.o > l.p ? '🔥 ' : '') + l.q + ' × ' + fmt(l.p) + ' = ' + fmt(l.q * l.p) + ' ج' : 'الكمية: ' + l.q;
      T(nums, L, top + 30, 'bold 27px ' + FONT, '#0E6B5C', 'left');
      if (imgs) y = Math.max(y, top - 30 + IMG + 6);
      y += 12; bar(y, '#f0f0f0', 2); y += 32;
    });
    y += 4; T('إجمالي القطع: ' + count(), R, y, 'bold 30px ' + FONT, '#111'); y += 52;
    if (CFG.show_price && total() > 0) { T('الإجمالي: ' + fmt(total()) + ' ج', R, y, 'bold 42px ' + FONT, '#0E6B5C'); y += 60; }
    if (CFG.show_price && total() > CFG.free_over) { bar(y - 8, '#e8f5ee', 62); T(CFG.free_text, W / 2, y + 32, 'bold 28px ' + FONT, '#15803D', 'center'); y += 82; }
    if (note) { ctx.font = '26px ' + FONT; wrap(ctx, '📝 ' + note, W - 2 * pad).forEach(ln => { T(ln, R, y, '26px ' + FONT, '#444'); y += 38; }); y += 6; }
    T('شكراً لاختياركم ' + CFG.store + ' 💚', W / 2, y + 20, '26px ' + FONT, '#888', 'center');
    return y + 70;
  }
  const probe = document.createElement('canvas').getContext('2d');
  const H = Math.ceil(paint(probe, true));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  paint(ctx, false); return c;
}
function loadImg(src) {
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}
async function loadInvoiceImgs() {
  const imgs = {}, ids = Array.from(new Set(cart.map(l => l.id)));
  await Promise.all(ids.map(async id => { imgs[id] = await loadImg(imgUrl(cart.find(l => l.id === id), 't')); }));
  return imgs;
}
async function shareInvoice(name, note) {
  const imgs = await loadInvoiceImgs();
  const c = buildInvoice(name, note, imgs);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const file = new File([blob], 'فاتورة-طرابيه.png', {type: 'image/png'});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'فاتورة-طرابيه.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('اتحفظت الصورة - ابعتها من المعرض على واتساب');
}

/* ---------- الشريط السفلي والتحميل ---------- */
function renderBar() {
  const n = count(), bar = $('#bar');
  bar.style.display = n > 0 ? 'block' : 'none';
  $('#barbtn').textContent = '🛒 عرض الطلب (' + n + ' قطعة)' + (CFG.show_price && total() > 0 ? ' — ' + fmt(total()) + ' ج' : '');
}
function applyCfg() {
  $('#store').textContent = CFG.store; $('#sub').textContent = CFG.sub; document.title = CFG.store + ' ' + CFG.sub;
  const b = $('#banner'); b.textContent = CFG.banner || ''; b.style.display = CFG.banner ? 'block' : 'none';
}
async function loadCfg() {
  try { const r = await fetch('app.json', {cache: 'no-cache'}); if (r.ok) { const j = await r.json(); CFG = Object.assign({}, DEF, j); try { localStorage.setItem('tb_cfg', JSON.stringify(j)); } catch (e) {} return; } } catch (e) {}
  try { CFG = Object.assign({}, DEF, JSON.parse(localStorage.getItem('tb_cfg') || '{}')); } catch (e) {}
}
async function prefetchAll() {
  const list = P.slice(), prog = $('#prog'); let done = 0;
  toast('بنحمّل الصور... سيب الصفحة مفتوحة');
  const worker = async () => { while (list.length) { const p = list.pop(); try { await fetch(imgUrl(p, 't')); } catch (e) {} done++; prog.style.width = (100 * done / P.length) + '%'; } };
  await Promise.all([worker(), worker(), worker(), worker(), worker()]);
  prog.style.width = '0'; toast('✅ الكتالوج اتحفظ - هيشتغل من غير نت');
}
async function init() {
  $('#empty').style.display = 'block'; $('#empty').textContent = 'جاري تحميل المنتجات…';
  await loadCfg(); applyCfg(); renderBar(); initStats(); renderHist();
  try {
    const r = await fetch('catalog.json', {cache: 'no-cache'}); if (!r.ok) throw new Error('HTTP ' + r.status);
    P = norm(await r.json()); byId = {}; P.forEach(p => byId[p.id] = p);
    renderChips(); renderSizes(); renderGrid(); openFromHash();
  } catch (e) { $('#empty').style.display = 'block'; $('#empty').textContent = 'تعذر تحميل الكتالوج - اتأكد من النت وجرّب تاني'; }
  if (CFG.notice && localStorage.getItem('tb_notice') !== h(CFG.notice)) { try { localStorage.setItem('tb_notice', h(CFG.notice)); } catch (e) {} setTimeout(() => alert(CFG.notice), 400); }
}
$('#grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openProduct(+c.dataset.id); });
$('#grid').addEventListener('error', e => { if (e.target && e.target.tagName === 'IMG') e.target.style.display = 'none'; }, true);
$('#sizechips').addEventListener('click', e => { const b = e.target.closest('.chip-c'); if (b) { size = size === b.dataset.s ? '' : b.dataset.s; renderSizes(); renderGrid(); } });
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip-c'); if (b) { cat = b.dataset.c; renderChips(); renderGrid(); } });
let st, st2; $('#search').addEventListener('input', e => { const raw = e.target.value.trim(); clearTimeout(st); st = setTimeout(() => { q = ar(raw); renderGrid(); }, 150); clearTimeout(st2); st2 = setTimeout(() => { if (raw.length >= 2) track('search/' + raw, 'بحث: ' + raw); }, 1500); });
$('#barbtn').addEventListener('click', openCart);
$('#hist').addEventListener('click', openOrders);
$('#sort').addEventListener('change', e => { sortMode = e.target.value; renderGrid(); });
$('#ov').addEventListener('click', () => closeSheet());
$('#offline').addEventListener('click', prefetchAll);
window.addEventListener('popstate', () => { if (sheetOpen) closeSheet(true); });
if ('IntersectionObserver' in window) new IntersectionObserver(es => { if (es[0].isIntersecting) loadMore(); }, {rootMargin: '600px'}).observe($('#more'));
let dip; window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; $('#install').style.display = 'block'; });
$('#install').addEventListener('click', async () => { if (dip) { dip.prompt(); await dip.userChoice; dip = null; $('#install').style.display = 'none'; } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__tb = {norm, orderText, deliveryMsg, buildInvoice, tok, sizeList, set: (c, p, ct) => { CFG = Object.assign({}, DEF, c); P = norm(p); cart = ct; }};
init();
})();
